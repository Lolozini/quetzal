{{- /*
What reaching a database server takes that is secret: its DSN, password
included, or, when the connection is given field by field (db.host), the
password alone. It used to be a plain value of the Deployment's environment,
readable by whoever may read Deployments in the namespace -- more people than
may read its Secrets -- and it had to sit in the values in clear. A SQLite DSN
is only a path and stays where it was.
*/ -}}
{{- $db := .Values.db }}
{{- $dsn := and (ne $db.driver "sqlite") (not $db.host) (not $db.existingSecret) }}
{{- $password := and $db.host $db.password (not $db.existingPasswordSecret) }}
{{- if or $dsn $password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quetzal.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quetzal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $password }}
  password: {{ $db.password | quote }}
  {{- else }}
  dsn: {{ $db.dsn | quote }}
  {{- end }}
{{- end }}
