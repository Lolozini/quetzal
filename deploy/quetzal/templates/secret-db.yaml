{{- /*
The DSN of a database server, password included. It used to be a plain value
of the Deployment's environment, readable by whoever may read Deployments in
the namespace -- more people than may read its Secrets -- and it had to sit in
the values in clear. A SQLite DSN is only a path and stays where it was.
*/ -}}
{{- if and (ne .Values.db.driver "sqlite") (not .Values.db.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quetzal.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quetzal.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.db.dsn | quote }}
{{- end }}
