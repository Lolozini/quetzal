apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quetzal.fullname" . }}
  labels:
    {{- include "quetzal.labels" . | nindent 4 }}
spec:
  replicas: 1
  # SQLite on a shared PVC: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quetzal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quetzal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "quetzal.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        # distroless nonroot uid/gid; numeric runAsUser so the kubelet can
        # verify non-root, and fsGroup so the process can write the PVC.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Single process owns schema creation + template seeding so the two main
        # containers never race on a fresh shared database.
        - name: migrate
          image: {{ include "quetzal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/quetzal-apiserver"]
          env:
            {{- include "quetzal.commonEnv" . | nindent 12 }}
            - name: QUETZAL_MIGRATE_ONLY
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: apiserver
          image: {{ include "quetzal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/quetzal-apiserver"]
          env:
            {{- include "quetzal.commonEnv" . | nindent 12 }}
            - name: QUETZAL_ADDR
              value: ":8080"
            - name: QUETZAL_SECURE_COOKIES
              value: {{ .Values.secureCookies | quote }}
            # Trust X-Forwarded-For (for per-client rate limiting) when behind the
            # chart's ingress or when explicitly enabled. The rightmost hop is used,
            # so it's only safe behind a proxy that appends the real client IP.
            - name: QUETZAL_TRUST_PROXY
              value: {{ or .Values.trustProxy .Values.ingress.enabled | quote }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: controller
          image: {{ include "quetzal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/quetzal-controller"]
          env:
            {{- include "quetzal.commonEnv" . | nindent 12 }}
            - name: QUETZAL_LEADER_ELECTION
              value: {{ .Values.leaderElection | quote }}
            - name: QUETZAL_METRICS_ADDR
              value: ":9090"
            - name: QUETZAL_RESYNC
              value: {{ .Values.resync | quote }}
            # Wake-on-connect: the activator runs as this same image and calls
            # back to the apiserver Service to wake a server.
            - name: QUETZAL_IMAGE
              value: {{ include "quetzal.image" . | quote }}
            - name: QUETZAL_APISERVER_URL
              value: "http://{{ include "quetzal.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}"
            # The ClusterRole to bind in each namespace the controller creates,
            # instead of holding that access across the whole cluster.
            - name: QUETZAL_NAMESPACED_ROLE
              value: {{ printf "%s-namespaced" (include "quetzal.fullname" .) | quote }}
            {{- with .Values.egressAllow }}
            # Private ranges every game server may reach, on top of the public
            # internet. Their policy denies private address space so the cluster
            # network is out of reach; managed databases are allowed
            # automatically, so this is only for what Quetzal cannot infer — an
            # external database named by DNS, a license server on the LAN.
            - name: QUETZAL_EGRESS_ALLOW
              value: {{ join "," . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "quetzal.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- define "quetzal.commonEnv" -}}
- name: QUETZAL_DB_DRIVER
  value: {{ .Values.db.driver | quote }}
- name: QUETZAL_DB_DSN
  value: {{ .Values.db.dsn | quote }}
- name: POD_NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
- name: POD_NAME
  valueFrom:
    fieldRef:
      fieldPath: metadata.name
{{- with .Values.nodePort.min }}
# Both processes allocate from this pool and neither can see the other's view of
# it: the apiserver hands out the game ports, the controller the SFTP one. Tell
# only one and the other quietly falls back to the cluster's whole range, which
# on a narrowed pool means ports nobody opened on the firewall.
- name: QUETZAL_NODEPORT_MIN
  value: {{ . | quote }}
{{- end }}
{{- with .Values.nodePort.max }}
- name: QUETZAL_NODEPORT_MAX
  value: {{ . | quote }}
{{- end }}
- name: QUETZAL_SECRET_KEY
  valueFrom:
    secretKeyRef:
      name: {{ include "quetzal.fullname" . }}-secretkey
      key: secret-key
{{- end -}}
