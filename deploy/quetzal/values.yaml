image:
  repository: ghcr.io/lolozini/quetzal
  # tag defaults to the chart appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Database. SQLite (default) keeps Quetzal self-contained on a PVC shared by the
# apiserver and controller; use Postgres for production / HA.
db:
  driver: sqlite
  dsn: "/data/quetzal.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  # Mount a claim you made yourself instead of the one this chart creates: a
  # pre-provisioned volume, or a dataset you are migrating an existing install
  # onto. The chart then creates no claim, and size/storageClass are ignored.
  existingClaim: ""

service:
  type: ClusterIP
  port: 8080

# Node port pool for servers exposed via NodePort. Empty values fall back to the
# cluster's default service node port range (30000-32767). Quetzal tracks its own
# allocations in the database but is NOT aware of node ports Kubernetes assigns
# itself (LoadBalancer / health-check ports, or NodePort Services created outside
# Quetzal). On a shared cluster, narrow this to a block reserved for Quetzal (and
# open on your firewall) to avoid collisions.
nodePort:
  min: ""
  max: ""

ingress:
  enabled: false
  className: ""
  host: quetzal.example.com
  annotations: {}
  tls: false
  tlsSecretName: ""

# Mark session cookies Secure (enable when served over HTTPS).
secureCookies: false

# Trust X-Forwarded-For for per-client rate limiting. Auto-enabled when
# ingress.enabled is true; set explicitly if a different proxy fronts the panel.
# Only safe behind a proxy that appends the real client IP (the rightmost hop).
trustProxy: false

# Controller HA leader election (recommended; harmless with a single replica).
leaderElection: true
resync: "15s"

# Private address ranges every game server may reach, on top of the public
# internet. A server's NetworkPolicy denies private space by default, so it
# cannot reach the cluster network, the node, other tenants or your LAN.
# Managed databases are allowed automatically. Use this only for what Quetzal
# cannot work out on its own — an external database reached by hostname (a
# NetworkPolicy has no notion of DNS, so it needs its address here), or another
# service on your network that your servers legitimately talk to.
#   egressAllow: ["192.168.10.20/32"]
egressAllow: []

# An admission policy that keeps the control plane's account inside the
# namespaces it creates. RBAC scopes what it can read; this scopes the one write
# — handing itself its own role — that would otherwise undo that scoping, and the
# namespace deletions that go with it.
#
# Needs Kubernetes 1.30, where ValidatingAdmissionPolicy went GA. Turn it off on
# an older cluster: Quetzal runs exactly the same, you lose this guard.
admissionPolicy:
  enabled: true
  # The prefix of the namespaces Quetzal owns. Change it only if you have also
  # changed the naming in the control plane, which is not configurable today.
  namespacePrefix: quetzal

# The key Quetzal encrypts stored credentials with: S3 keys, SFTP passwords, 2FA
# secrets. The chart generates one on first install and reuses it on upgrade.
# Point this at a Secret of your own to manage it yourself, with SOPS or an
# external secret operator.
#
# On an install that already holds data, migrate the existing key rather than
# issuing a new one: everything encrypted under the old key stops being readable.
secretKey:
  existingSecret: ""
  existingSecretKey: secret-key

# Extra environment for the apiserver, the controller and the migration step, in
# the usual Kubernetes form. TZ is the one most installs want: schedules are
# evaluated in the process's local time, which is UTC unless you say otherwise.
#   extraEnv:
#     - name: TZ
#       value: Europe/Paris
extraEnv: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
