openapi: 3.0.3
info:
  title: Quetzal API
  version: "1.0"
  license:
    name: MIT
  description: |
    HTTP API for Quetzal, a Kubernetes-native game-server control plane.

    ## Authentication
    Most endpoints require authentication. Two credential types are accepted:

    - **API key** (recommended for scripts): send `Authorization: Bearer <token>`.
      Create a key under *Account → API keys*; it inherits the owner's
      permissions. Tokens are shown once at creation. A key needs no second
      factor, even on an account with two-factor authentication: it stands
      for the password and the second factor together.
    - **Session cookie**: set by `POST /api/login` and used by the web UI.

    A key/session identifies a user; per-server access follows that user's
    ownership and granted subuser permissions. Admin-only endpoints are noted.

    ## Conventions
    - Request and response bodies are JSON unless noted.
    - Mutating requests made from a browser are subject to a same-origin check.
    - Authentication endpoints are rate limited (HTTP 429 with `Retry-After`).
servers:
  - url: /
    description: Same origin as the panel
tags:
  - name: Auth
    description: Setup, login, and the current user
  - name: Servers
    description: Server lifecycle, configuration and power
  - name: Console
    description: Live console (logs + attach) over WebSocket
  - name: Files
    description: File manager (exec into the running pod; requires the files permission)
  - name: SFTP
    description: SSH keys and per-server SFTP access
  - name: Schedules
    description: Cron schedules per server
  - name: Backups
    description: Backup configuration, backup and restore
  - name: Access
    description: Subuser access and per-server audit
  - name: Users
    description: User management (admin) and self-service
  - name: AdminRoles
    description: Scoped admin permission bundles (superadmin)
  - name: Email
    description: Self-service password reset and system SMTP settings
  - name: TwoFactor
    description: TOTP two-factor authentication, opt-in or required panel-wide
  - name: APIKeys
    description: Bearer tokens for the API
  - name: Clusters
    description: Multi-cluster registry
  - name: Notifications
    description: Notification channels and the event feed
  - name: Databases
    description: Database host registry (admin) and per-server databases
  - name: Internal
    description: In-cluster callbacks (not for external use)

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /api/version:
    get:
      tags: [Meta]
      summary: Build information (version, commit, build date)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  date: { type: string }
                  go: { type: string }
  /api/setup/status:
    get:
      tags: [Auth]
      summary: Whether first-run setup is needed
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  needed: { type: boolean }
  /api/setup:
    post:
      tags: [Auth]
      summary: Create the first admin account (first run only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Admin created (session cookie set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { description: Setup already completed }
  /api/login:
    post:
      tags: [Auth]
      summary: Log in
      description: >
        On success a session cookie is set and the user is returned. If the
        account has 2FA enabled and no `code` was supplied, the response is
        `{ "twoFactorRequired": true }` with no session; resubmit with a TOTP or
        recovery code. A successful login also sets a long-lived device cookie
        for the account: failed attempts from a client that holds one count
        against that client alone, those from any other against the account
        (10 per 15 minutes), so failures elsewhere do not lock the account's
        owner out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Authenticated, or a 2FA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      twoFactorRequired: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/logout:
    post:
      tags: [Auth]
      summary: Log out (clears the session)
      responses:
        "204": { description: Logged out }
  /api/me:
    get:
      tags: [Auth]
      summary: The current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/password:
    post:
      tags: [Users]
      summary: Change your own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/me/email:
    put:
      tags: [Email]
      summary: Set or clear your own email (used for password reset; not verified)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { email: { type: string, format: email } }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/forgot-password:
    post:
      tags: [Email]
      summary: Request a password-reset email
      description: >-
        Always responds 200 regardless of whether the identifier matched (no
        account enumeration); the email is sent only if the account exists, has
        an email, and SMTP + the public URL are configured. Rate-limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { identifier: { type: string, description: username or email } }
      responses:
        "200": { description: Always returned (uniform response) }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/reset-password:
    post:
      tags: [Email]
      summary: Complete a password reset with an emailed token
      description: >-
        Validates the single-use token, sets the new password, then invalidates
        the token and all of that user's sessions. 2FA is left untouched.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Password reset }
        "400": { description: Invalid/expired token or weak password }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/invites/inspect:
    post:
      tags: [Access]
      summary: Read what an invitation link offers
      description: The token from the link is the credential. Rate-limited per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  server: { type: string, description: The server's display name }
                  invitedBy: { type: string }
                  email: { type: string }
                  permissions: { type: array, items: { type: string } }
                  expiresAt: { type: string, format: date-time }
                  signup: { type: boolean, description: Whether the link may create an account }
        "404": { description: The invitation was used, withdrawn or has expired }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/invites/accept:
    post:
      tags: [Access]
      summary: Accept an invitation with the account signed in
      description: >
        Grants the invitation's permissions on its server (replacing a grant the
        account already had there) and uses the link up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties: { serverId: { type: integer } }
        "400": { description: The account owns the server }
        "404": { description: The invitation was used, withdrawn or has expired }
  /api/invites/register:
    post:
      tags: [Access]
      summary: Create an account from an invitation, accept it, and sign in
      description: >
        The account may own no server until an administrator allows it, and its
        email is the invited address. Refused (403) when the panel does not
        create accounts from invitations. Sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string }
                username: { type: string, minLength: 3 }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "201":
          description: Created and signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  serverId: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: The panel does not create accounts from invitations }
        "404": { description: The invitation was used, withdrawn or has expired }
        "409": { description: The username is taken }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/security-settings:
    get:
      tags: [Servers]
      summary: Read the panel's authentication policy (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requireTwoFactor: { type: string, enum: [off, admins, all] }
                  options: { type: array, items: { type: string } }
                  impact:
                    type: object
                    description: >
                      For each policy, what it would hold back today: the
                      accounts it covers that have no second factor, and the
                      API keys those accounts hold.
                    additionalProperties:
                      type: object
                      properties:
                        accounts: { type: integer }
                        apiKeys: { type: integer }
                  inviteSignup:
                    type: boolean
                    description: Whether an invitation may create the account it is accepted from.
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Servers]
      summary: Set who must hold a second factor, and whether invitations create accounts (superadmin)
      description: >
        Changes the fields it names and leaves the others. Accounts the policy
        covers keep their session but reach only `/api/me`, the enrolment
        endpoints and logout until they have a second factor, and their API
        keys are refused meanwhile. A policy that covers the caller is refused
        (409) until the caller has a second factor of their own; a refused
        request changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requireTwoFactor: { type: string, enum: [off, admins, all], description: An empty string means off. }
                inviteSignup: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  requireTwoFactor: { type: string }
                  inviteSignup: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The policy covers the caller, who has no second factor }

  /api/network-settings:
    get:
      tags: [Servers]
      summary: Get the published endpoint hostname (admin)
      description: >-
        Returns the panel-wide hostname advertised to players instead of the raw
        node IP, plus the detected node address as a hint for the DNS record. A
        cluster may override the hostname for its own servers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpointHost: { type: string }
                  nodeAddress: { type: string, description: Detected node address (hint only) }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Servers]
      summary: Set the published endpoint hostname (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { endpointHost: { type: string, description: "A DNS name or an IP address, without scheme or port; empty falls back to the node address" } }
      responses:
        "204": { description: Saved }
        "400": { description: Not a DNS name or an IP address }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/email-settings:
    get:
      tags: [Email]
      summary: Get system SMTP settings (admin)
      description: The password is never returned, only whether one is set.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  host: { type: string }
                  port: { type: string }
                  username: { type: string }
                  from: { type: string }
                  tls: { type: string }
                  hasPassword: { type: boolean }
                  publicUrl: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Email]
      summary: Update system SMTP settings + public URL (admin)
      description: An empty host clears the SMTP config; a blank password keeps the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
                port: { type: string }
                username: { type: string }
                password: { type: string, format: password }
                from:
                  type: string
                  description: >-
                    The sender: an address, or a name and one as
                    `Quetzal <quetzal@example.com>`. Required with a host;
                    anything else is refused with a 400.
                tls: { type: string, enum: [starttls, tls, none] }
                publicUrl: { type: string }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/email-settings/test:
    post:
      tags: [Email]
      summary: Send a test email with the stored settings (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { to: { type: string, description: defaults to your account email } }
      responses:
        "204": { description: Sent }
        "400": { description: Not configured or no recipient }
        "502": { description: Send failed }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/database-hosts:
    get:
      tags: [Databases]
      summary: List database hosts (admin)
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Databases]
      summary: Register a database host (admin)
      description: >-
        kind=external registers an existing MySQL/MariaDB (host/port/adminUser/
        adminPassword required). kind=managed has Quetzal deploy and own a MariaDB
        in-cluster (image/storageSize/namespace optional; root password generated).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabaseHostInput" }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/database-hosts/{hid}:
    parameters:
      - { name: hid, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Databases]
      summary: Update a database host (admin)
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Databases]
      summary: Delete a database host (admin)
      description: Rejected with 409 while the host still holds databases.
      responses:
        "204": { description: Deleted }
        "409": { description: Host still has databases }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/database-hosts/{hid}/test:
    parameters:
      - { name: hid, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Databases]
      summary: Probe a host's connectivity (admin)
      responses:
        "200": { description: Host with refreshed reachability }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/servers/{id}/database-hosts:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Databases]
      summary: Hosts a server may create databases on (minimal view)
      description: Requires the databases permission; no admin secrets returned.
      responses:
        "200": { description: OK }
  /api/servers/{id}/databases:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Databases]
      summary: List a server's databases
      description: Requires the databases permission. Passwords are not included.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServerDatabase" } }
    post:
      tags: [Databases]
      summary: Provision a database + scoped user for the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId]
              properties: { hostId: { type: integer } }
      responses:
        "201":
          description: Created (response includes the generated password once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDatabase" }
        "409": { description: Host at capacity }
        "502": { description: Provisioning failed on the host }
  /api/servers/{id}/databases/{dbid}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - { name: dbid, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Databases]
      summary: A database with its current credentials (incl. password)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDatabase" }
    delete:
      tags: [Databases]
      summary: Drop the database and its user
      responses:
        "204": { description: Deleted }
  /api/servers/{id}/databases/{dbid}/rotate:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - { name: dbid, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Databases]
      summary: Rotate the database user's password
      responses:
        "200":
          description: New credentials (includes the new password)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerDatabase" }

  /api/me/sshkeys:
    get:
      tags: [SFTP]
      summary: List your SSH public keys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SSHKey" }
    post:
      tags: [SFTP]
      summary: Add an SSH public key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                name: { type: string }
                publicKey: { type: string, description: An authorized_keys line }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHKey" }
        "400": { description: Invalid SSH public key }
        "409":
          description: The key is already on your account
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  existing:
                    type: object
                    description: The key already registered
                    properties:
                      id: { type: integer }
                      name: { type: string }
  /api/me/sshkeys/{kid}:
    parameters:
      - { name: kid, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [SFTP]
      summary: Delete one of your SSH keys
      responses:
        "204": { description: Deleted }
  /api/servers/{id}/sftp:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [SFTP]
      summary: SFTP connection details for a server
      description: >-
        Requires the files permission. Port is the assigned NodePort (0 until
        Kubernetes assigns it, or if no system image is configured — the server
        status reports the latter). Auth is key-only (register keys via
        /api/me/sshkeys); the username is cosmetic. Access is confined to the
        data directory. A key added or deleted reaches the pod within a minute
        or two (a controller resync, then the kubelet's refresh of a mounted
        ConfigMap): from then on it is accepted or refused, and the sessions a
        deleted key opened are closed within seconds.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  username: { type: string }
                  port: { type: integer }
                  host:
                    type: string
                    description: >-
                      Hostname to connect to: the cluster's endpoint hostname, else
                      the panel-wide one, else the detected node address. Empty
                      until SFTP is provisioned.

  /api/me/2fa/setup:
    post:
      tags: [TwoFactor]
      summary: Begin TOTP enrollment
      description: Returns a secret and otpauth URI; not active until enabled.
      responses:
        "200":
          description: Pending enrollment
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  uri: { type: string, description: otpauth:// provisioning URI }
        "409": { description: 2FA already enabled }
  /api/me/2fa/enable:
    post:
      tags: [TwoFactor]
      summary: Confirm enrollment with a code
      description: Activates 2FA and returns one-time recovery codes (shown once).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "400": { description: Invalid code or no enrollment in progress }
  /api/me/2fa/disable:
    post:
      tags: [TwoFactor]
      summary: Disable your 2FA (re-verifies a code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        "204": { description: 2FA disabled }
        "400": { description: Invalid code or 2FA not enabled }

  /api/templates:
    get:
      tags: [Servers]
      summary: List available templates (eggs)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
  /api/templates/import:
    post:
      tags: [Servers]
      summary: Import an egg or an exported template as a template (admin)
      description: >-
        Accepts either a Pterodactyl/Pelican egg or the JSON this panel's own
        export endpoint produces — the format is detected from the document, so a
        template can be moved between installs by exporting and importing it. A
        document whose slug another template already has is refused with a 409
        describing that template, unless ifExists says what to do; an id in the
        body is ignored.
      parameters:
        - $ref: "#/components/parameters/ImportIfExists"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Pterodactyl/Pelican egg, or an exported Quetzal template
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { description: The document parsed as neither an egg nor a template }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ImportConflict" }
  /api/templates/import-url:
    post:
      tags: [Servers]
      summary: Import an egg from a URL (admin)
      description: >-
        Fetches an egg JSON from a URL (SSRF-guarded: http(s) only, non-public
        addresses refused) and imports it as a template, like /import, slug
        conflicts included. Used for ad-hoc imports. Repository file-page URLs
        (GitHub/GitLab "blob") are rewritten to their raw equivalent before
        fetching.
      parameters:
        - $ref: "#/components/parameters/ImportIfExists"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties: { url: { type: string, format: uri } }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { description: Missing URL or invalid egg }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ImportConflict" }
        "502": { description: Could not fetch the URL }
  /api/templates/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Servers]
      summary: Get one template
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "404": { description: Not found }
    put:
      tags: [Servers]
      summary: Replace a template from native JSON (admin)
      description: Round-trips with export. The slug is fixed; the version is bumped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Template" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Servers]
      summary: Delete a template (admin)
      description: Refused with 409 while servers still use it. Built-ins return on restart.
      responses:
        "204": { description: Deleted }
        "409": { description: Template still in use }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/templates/{slug}/export:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Servers]
      summary: Export a template as native JSON (admin)
      responses:
        "200": { description: Native template JSON (re-importable via PUT) }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/servers:
    parameters:
      - name: q
        in: query
        required: false
        description: >
          Narrow the list to servers whose slug or display name contains this
          text, case-insensitively. Filtering happens in the database; `%` and
          `_` in the query are literal.
        schema: { type: string }
    get:
      tags: [Servers]
      summary: List servers you can access
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Server" }
    post:
      tags: [Servers]
      summary: Create a server
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServerRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: A server with this name already exists }
  /api/servers/{id}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Servers]
      summary: Get a server
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Servers]
      summary: Update settings (name, exposure, hibernation, SFTP, startup variables, resources, image)
      description: >-
        All fields are optional; only the present ones change. A rename changes
        the displayed name only, never the slug. Editing env, resources or the
        image is applied on the next reconcile, which restarts the server.
        env is validated against the template's variable contract; a blank
        secret variable keeps the stored value. resources are re-checked against
        the owner's quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 190
                  description: New display name (trimmed; one line)
                expose: { $ref: "#/components/schemas/Expose" }
                hibernation: { $ref: "#/components/schemas/Hibernation" }
                sftp:
                  type: object
                  properties: { enabled: { type: boolean } }
                env:
                  type: object
                  additionalProperties: { type: string }
                  description: Startup variable values (editable variables only)
                resources: { $ref: "#/components/schemas/Resources" }
                image:
                  type: string
                  description: >-
                    The image to run, one of the template's (400 otherwise)
                    unless the caller is an administrator. Nothing is
                    reinstalled.
                reaches:
                  type: array
                  items: { type: string }
                  description: >-
                    Slugs of the servers this one may reach inside the cluster
                    (replaces the list). The caller must be able to change each
                    of them, and they must run on the same cluster.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
    delete:
      tags: [Servers]
      summary: Delete a server
      parameters:
        - name: keepData
          in: query
          schema: { type: boolean }
          description: Retain the data volume (overrides the server's stored policy).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/servers/{id}/power:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Servers]
      summary: Power action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, kill] }
      description: >-
        stop sends the template's stop command, then stops the pod (SIGTERM,
        then the template's grace). restart does the same and starts the server
        again once its pod is gone; a server that is not running is left alone.
        kill stops the game at once (SIGKILL), and the server comes back up.
      responses:
        "200":
          description: Action accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  result: { type: string }
        "409":
          description: >-
            The server is suspended, being transferred or imported, or — for
            start — a restore of its data is waiting or running
  /api/servers/{id}/reinstall:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Servers]
      summary: Reinstall the server, optionally on another template or image
      description: >-
        Bumps the install generation so the install init container re-runs; the
        change rolls the pod on the next reconcile (a stopped server reinstalls
        on its next start). wipeData also clears the data volume before the
        script runs.


        With `template`, the server moves to another template first (owner or
        an administrator only): ports, resources, storage and — unless wiped —
        files are kept. Variables the new template also declares keep their
        value, unless it fixes them (not editable) or the value is not one of
        its options; those take the new defaults and are listed in `reset`.
        A variable it requires and nothing can fill must be given in `env`.
        Switching to a template with no install script is allowed (status
        `switched`, nothing to run), without wipeData.


        With `image`, the server moves to another of the (target) template's
        images; an administrator may name any image. Without it, a template
        change keeps the current image when the new template offers it, and
        otherwise takes its default. The body is optional, but one that does
        not parse is refused rather than read as a plain reinstall.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wipeData: { type: boolean }
                template: { type: string, description: Slug of the template to move to }
                image: { type: string, description: One of the target template's image refs }
                env:
                  type: object
                  additionalProperties: { type: string }
                  description: Values for the new template's variables; only with a template change
      responses:
        "200":
          description: Reinstall triggered, or template switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [reinstalling, switched] }
                  wipeData: { type: boolean }
                  template: { type: string }
                  image: { type: string }
                  reset:
                    type: array
                    items: { type: string }
                    description: New-template variables that took their default instead of the current value
        "400": { description: "No install script, unknown template, image off the list, missing required variable, or an unreadable body" }
        "403": { description: A template change by someone other than the owner or an administrator }
  /api/servers/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Servers]
      summary: Live CPU/memory (metrics-server) + network/disk (pod exec)
      description: >-
        A server with nothing to measure -- no pod, or no metrics-server on its
        cluster -- answers 200 with `available: false` and a `reason`, next to
        the limits it is set to.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStats" }
        "503": { description: The server's cluster or its pods cannot be read }
  /api/servers/{id}/console:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Console]
      summary: Live console (WebSocket)
      description: >
        Upgrades to a WebSocket carrying console messages
        (`{type: stdout|stdin|status|error, data}`). stdout streams pod logs;
        stdin is delivered via the pod attach subresource.
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/servers/{id}/files:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Files]
      summary: List a directory
      description: >
        Lists entries in `path` (relative to the server's data root). File
        operations run in the always-on data-manager pod, which mounts the data
        volume, so they work whether the server is running or stopped. `path` is
        confined to the data root. All file endpoints share this behavior.
      parameters:
        - { name: path, in: query, schema: { type: string }, description: Directory relative to the data root }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    size: { type: integer, format: int64 }
                    mtime: { type: integer, format: int64, description: Last modification in Unix seconds (absent when the image has no stat) }
                    dir: { type: boolean }
        "409": { description: Server is mid-start (not yet running and not fully stopped), retry once it settles; or it is suspended (owners/subusers are blocked, admins may still inspect) }
    delete:
      tags: [Files]
      summary: Delete a file or directory (recursive)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { description: Refusing to delete the data root }
  /api/servers/{id}/files/content:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Files]
      summary: Read or download a file
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: string, enum: ["1"] }, description: Force a download response }
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
    put:
      tags: [Files]
      summary: Write (create/overwrite) a file
      description: Raw request body is written to `path` (truncating). Used for save and upload.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Written }
  /api/servers/{id}/files/archive:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Files]
      summary: Download a file or directory as a gzip tarball
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: A .tar.gz stream
          content:
            application/gzip:
              schema: { type: string, format: binary }
  /api/servers/{id}/files/extract:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Upload an archive and extract it into a directory
      description: >-
        Imports a world, modpack or Pterodactyl backup: the request body is the
        archive, streamed into tar/unzip in the pod. format is "tar" (gz/bz2/xz)
        or "zip". The image must have the matching tool.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [tar, zip] } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Extracted }
        "502": { description: Extraction failed (missing tool or bad archive) }
  /api/servers/{id}/uploads:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Files]
      summary: List the caller's unfinished uploads to this server
      description: >-
        For resuming: an upload is the caller's alone, and lasts 24 hours after
        its last piece. `received` is -1 here; read one upload for it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FileUpload" } }
    post:
      tags: [Files]
      summary: Start an upload sent in pieces
      description: >-
        For files of any size, behind any proxy: each piece is its own request,
        so none has to outlast a proxy's read timeout (Traefik 3 cuts at 60
        seconds), and an interrupted upload resumes from what arrived. The
        pieces gather in a temporary file beside the destination
        (`<file>.quetzal-part-<id>`, or `.quetzal-upload-<id>` inside an
        archive's directory) and replace the destination in one step at the
        end. The destination is checked now: a file needs its directory, an
        archive's directory is created. At most 64 GiB, and 20 unfinished
        uploads per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, size]
              properties:
                path: { type: string, description: The file, or the directory an archive unpacks into, relative to the data root }
                size: { type: integer, format: int64, minimum: 1 }
                kind: { type: string, enum: [file, archive], default: file }
                format: { type: string, enum: [tar, zip], description: For an archive; tar covers gz, bz2 and xz }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: The destination's directory does not exist }
        "409": { description: Too many unfinished uploads, or file access is not available right now }
  /api/servers/{id}/uploads/{uid}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - { name: uid, in: path, required: true, schema: { type: string } }
    get:
      tags: [Files]
      summary: How much of an upload has arrived
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUpload" }
        "404": { description: No such upload, or it expired }
    put:
      tags: [Files]
      summary: Send a piece
      description: >-
        The body is the bytes from `offset`; Content-Length is required and at
        most 32 MiB. A piece cut short keeps what arrived: the answer, or a
        later read of the upload, says where to go on. A piece for another
        offset than the upload's size is refused with 409 and that size, which
        is how a piece sent twice after a lost answer is caught. One request at
        a time per upload.
      parameters:
        - { name: offset, in: query, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties: { received: { type: integer, format: int64 } }
        "400": { description: The piece goes past the upload's size, or the offset is not a number }
        "409":
          description: The offset is not where the upload is, or another request holds it
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  received: { type: integer, format: int64 }
        "411": { description: No Content-Length }
        "413": { description: The piece is over 32 MiB }
    delete:
      tags: [Files]
      summary: Cancel an upload and remove what arrived
      responses:
        "204": { description: Cancelled }
  /api/servers/{id}/uploads/{uid}/complete:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - { name: uid, in: path, required: true, schema: { type: string } }
    post:
      tags: [Files]
      summary: Finish an upload
      description: >-
        A file replaces its destination in one step; an archive is unpacked into
        its directory and removed. Refused with 409 until every byte has
        arrived, and the upload stays. A file that could not be put in place
        (its directory removed meanwhile, say) also stays, to be finished again.
      responses:
        "204": { description: In place }
        "409": { description: Not every byte has arrived yet }
        "502": { description: Extraction failed (missing tool or bad archive) }
  /api/servers/{id}/files/mkdir:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Create a directory (mkdir -p)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Created }
  /api/servers/{id}/files/rename:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Rename / move a file or directory
      parameters:
        - { name: path, in: query, required: true, schema: { type: string }, description: Source (relative to data root) }
        - { name: to, in: query, required: true, schema: { type: string }, description: Destination (relative to data root) }
      responses:
        "204": { description: Renamed }
  /api/servers/{id}/files/copy:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Copy a file or directory beside itself
      description: >-
        The copy is named like Pterodactyl's: `name copy.ext`, then `name copy
        1.ext` and on. Symbolic links inside a copied directory stay links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: Relative to the data root }
      responses:
        "200":
          description: Copied
          content:
            application/json:
              schema: { type: object, properties: { name: { type: string } } }
  /api/servers/{id}/files/delete:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Delete several entries of a directory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileBulk" }
      responses:
        "204": { description: Deleted }
        "400": { description: No names, more than 1000, or a name that is not a plain entry name }
  /api/servers/{id}/files/move:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Move several entries into a directory
      description: Nothing is overwritten; a name already taken in the destination stops the whole move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FileBulk"
                - type: object
                  required: [destination]
                  properties:
                    destination: { type: string, description: Existing directory, relative to the data root }
      responses:
        "204": { description: Moved }
        "400": { description: Destination is not a directory, or a name is taken there }
  /api/servers/{id}/files/compress:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Archive several entries into a .tar.gz on the server
      description: Written in `root` as `archive-<UTC date>.tar.gz`. The server's image needs tar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileBulk" }
      responses:
        "200":
          description: Archive created
          content:
            application/json:
              schema: { type: object, properties: { name: { type: string } } }
  /api/servers/{id}/files/decompress:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Files]
      summary: Extract an archive already on the server
      description: >-
        Unpacks into the directory holding the archive, overwriting files of the
        same name. .zip needs unzip in the server's image; .tar, .tar.gz/.tgz,
        .tar.bz2 and .tar.xz need tar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: The archive, relative to the data root }
      responses:
        "204": { description: Extracted }
        "400": { description: Not an archive format that can be extracted }

  /api/servers/{id}/install-log:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Servers]
      summary: Read a server's setup output
      description: >
        The output of the template's install script and of the config render,
        both of which run as init containers. This is where a server that never
        leaves Installing, or that lands in Error, says why. Requires the console
        permission rather than view: an install script runs with the server's
        environment, secret variables included.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod: { type: string }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step: { type: string }
                        log: { type: string }
                        state:
                          type: string
                          description: >
                            What Kubernetes reports for the step, e.g.
                            "failed: StartError (exit code 128)". It is the whole
                            answer when a step produced no log, which is what a
                            container that never started looks like.
                        message: { type: string }
                        error: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: No pod exists for this server yet. }

  /api/servers/{id}/schedules:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Schedules]
      summary: List schedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
    post:
      tags: [Schedules]
      summary: Create a schedule
      description: >
        Every task is checked against the permission its action needs directly:
        command needs console, start/stop/restart need power, and backup needs
        backups. A chain containing one task the caller could not run by hand is
        refused whole.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/servers/{id}/schedules/{sid}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - name: sid
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Schedules]
      summary: Update a schedule
      description: >
        Fields are optional; only what is sent is changed. A replacement task
        chain is authorized exactly as on create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Schedules]
      summary: Delete a schedule
      responses:
        "204": { description: Deleted }

  /api/backup-config:
    get:
      tags: [Backups]
      summary: Get backup configuration
      description: >-
        Any signed-in user learns whether backups are configured (`configured`,
        `keepLast`); the target itself and `editable: true` are returned only
        to holders of the settings admin permission.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfig" }
    put:
      tags: [Backups]
      summary: Set backup configuration (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupConfigInput" }
      responses:
        "200":
          description: Saved, with a warning that the panel could not reach the object store to check the bucket and the keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  warning: { type: string }
        "204": { description: Saved }
  /api/servers/{id}/backups:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Backups]
      summary: List backups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Backup" }
    post:
      tags: [Backups]
      summary: Trigger a backup
      description: >-
        The backup runs after the answer: the record comes back Pending, and
        its phase says how it ends. A backup of a server that is stopping
        waits for it to be down, up to 15 minutes.
      responses:
        "202":
          description: Backup requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
  /api/servers/{id}/backups/{bid}/restore:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - { name: bid, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Backups]
      summary: Restore from a backup
      description: >-
        The restore runs after the answer: the record comes back Pending, and
        its phase says how it ends. It waits for the server's pods to be gone,
        and is called off if its volume is still held 15 minutes later. Until
        it ends, or is cancelled by deleting it while still Pending, the server
        cannot be started and its files are unavailable.
      responses:
        "202":
          description: Restore requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "409": { description: The server is not stopped, or a restore is already waiting or running }
  /api/servers/{id}/backups/{bid}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - { name: bid, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Backups]
      summary: Delete a backup
      description: >-
        A succeeded backup owns a restic snapshot, so it is not simply dropped
        from the database: the record enters the Deleting phase and the
        controller forgets the snapshot from the repository first. Records with
        nothing to forget (a failed operation, a restore) are removed at once.
        A Pending operation has not started and is cancelled. A Running one
        cannot be deleted — it owns a Job, and a restore also owns the
        exclusive write mount on the data volume.
      responses:
        "202": { description: Snapshot deletion started; the record is now Deleting }
        "204": { description: Deleted, or cancelled before it started }
        "409": { description: The operation is running }

  /api/servers/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Servers]
      summary: Suspend a server (admin)
      description: >
        Stops the server and freezes it until it is unsuspended: its owner and
        subusers can still view it, and every other request they make about it
        answers 409. Its schedules do not run. Administrators keep every right.
      responses:
        "200": { description: Suspended }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/servers/{id}/unsuspend:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Servers]
      summary: Unsuspend a server (admin)
      responses:
        "200": { description: Unsuspended }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/import/pterodactyl/inspect:
    post:
      tags: [Servers]
      summary: Read a Pterodactyl server and map it to a create request
      description: >-
        Reads the server through the panel's client API and returns a draft of
        the create request (template matched by the egg's name, image, limits,
        allocations as ports, variable values), with warnings for whatever does
        not carry over. Nothing is created. The egg must already be imported as
        a template. The panel is reached through the same guard as other
        outbound requests: one on a private address is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PterodactylSource" }
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: object, additionalProperties: true }
                  draft: { type: object, additionalProperties: true }
                  warnings: { type: array, items: { type: string } }
        "400": { description: Unusable address or key }
        "502": { description: The panel refused or could not be reached }
  /api/servers/{id}/import/pterodactyl:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Servers]
      summary: Import a Pterodactyl server's data into a stopped server
      description: >-
        Has the panel back up the server (or, without a free backup slot,
        compress its files), streams the archive into this server's volume and
        marks it installed. Files already there are overwritten by the
        archive's; others are kept. This is also how a failed import is
        retried. Needs the files and settings permissions. While it runs,
        start, reinstall, restore and transfer answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PterodactylSource"
                - type: object
                  properties:
                    start: { type: boolean, description: Start the server once the data is in place }
      responses:
        "202":
          description: Import started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportState" }
        "400": { description: Unusable address or key }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The server is running, or an import or transfer is in progress }
  /api/servers/{id}/transfer:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Servers]
      summary: Transfer a server to another cluster (server-admin)
      description: >
        Migrates the server to another registered cluster. It is stopped, its
        data is backed up on the source and restored onto the destination
        (via the configured S3 backup target), then the source namespace is
        removed. Requires a configured backup target. While in progress,
        power/edit/reinstall are blocked — `DELETE` on this path cancels it if
        it stalls. Name the destination by its slug in `cluster`, as when
        creating a server; `targetCluster`, its ID, is still accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cluster: { type: string, description: The destination cluster's slug }
                targetCluster: { type: integer, description: The destination cluster's ID, in place of its slug }
      responses:
        "202": { description: Transfer started }
        "400": { description: No or unknown destination, no backup target, or already on that cluster }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: A transfer is already in progress }

    delete:
      tags: [Servers]
      summary: Cancel an in-progress transfer (server-admin)
      description: >
        Records the cancellation; the controller undoes the move on its next
        tick, since it is the side with cluster access. Before the cluster flip
        the server has not moved and the transfer is simply dropped; after it,
        the destination namespace is removed and the server returns to its
        source cluster. The source data is untouched throughout. Without this a
        transfer whose job stalls pins the server indefinitely.
      responses:
        "200":
          description: Cancellation already recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferState" }
        "202":
          description: Cancellation recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: No transfer is in progress. }
  /api/servers/{id}/access:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Access]
      summary: List subuser access
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServerAccess" }
    post:
      tags: [Access]
      summary: Grant a subuser scoped access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, permissions]
              properties:
                username: { type: string }
                permissions:
                  type: array
                  description: >-
                    view: the server's page, its usage and the lists of its backups,
                    schedules and activity; power: start/stop/restart/kill; console:
                    live console and setup log; schedules: manage scheduled tasks;
                    backups: take, restore, delete; files: files and SFTP; settings:
                    variables, resources, ports, exposure, hibernation, reinstall;
                    databases: databases and their passwords; delete: delete it.
                  items:
                    type: string
                    enum: [view, power, console, schedules, backups, files, settings, databases, delete]
      responses:
        "204": { description: Granted }
  /api/servers/{id}/access/{uid}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Access]
      summary: Revoke a subuser's access
      responses:
        "204": { description: Revoked }
  /api/servers/{id}/invites:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Access]
      summary: List a server's open invitations (owner or admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServerInvite" }
    post:
      tags: [Access]
      summary: Invite someone to the server by email (owner or admin)
      description: >
        Mails a link to the address. Whoever reads it accepts from the account
        they sign in to, or from one they create when the panel allows it: the
        address is never matched against accounts, whose email is not verified.
        The link is good for 7 days, once; inviting the same address again
        sends a new one and retires the old. Needs email and the panel's public
        address set up (409 otherwise). At most 50 open invitations per server,
        and 20 sent per hour by each account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, permissions]
              properties:
                email: { type: string, format: email, description: One bare address. }
                permissions:
                  type: array
                  description: As for granting access.
                  items:
                    type: string
                    enum: [view, power, console, schedules, backups, files, settings, databases, delete]
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email is not set up, or the server has too many open invitations }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: The mail could not be sent; nothing was kept }
  /api/servers/{id}/invites/{iid}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - name: iid
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Access]
      summary: Withdraw an invitation
      responses:
        "204": { description: Withdrawn; its link no longer works }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/servers/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - $ref: "#/components/parameters/ListBefore"
      - $ref: "#/components/parameters/Limit"
    get:
      tags: [Access]
      summary: A page of a server's audit entries
      description: >
        Newest first, paged with the `before` cursor. `X-Total-Count` gives the
        number of entries behind the page.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
  /api/audit:
    parameters:
      - $ref: "#/components/parameters/ListBefore"
      - $ref: "#/components/parameters/Limit"
    get:
      tags: [Access]
      summary: A page of the panel-wide audit log (admin)
      description: >
        Newest first, paged with the `before` cursor — pass the id of the oldest
        entry already held to walk back through the whole history.
        `X-Total-Count` gives the total.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /api/servers/{id}/notifications:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Notifications]
      summary: List a server's notification channels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationChannel" }
  /api/servers/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - $ref: "#/components/parameters/ListBefore"
      - $ref: "#/components/parameters/Limit"
    get:
      tags: [Notifications]
      summary: A server's event feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /api/events:
    parameters:
      - $ref: "#/components/parameters/ListBefore"
      - $ref: "#/components/parameters/Limit"
    get:
      tags: [Notifications]
      summary: Panel-wide event feed (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /api/notifications/event-types:
    get:
      tags: [Notifications]
      summary: The event types a channel can filter on
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /api/notifications/channels:
    get:
      tags: [Notifications]
      summary: List global notification channels (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationChannel" }
    post:
      tags: [Notifications]
      summary: Create a channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { description: "A setting is missing or invalid: an unknown event type, a url that is not http(s)" }
  /api/notifications/channels/{nid}:
    parameters:
      - { name: nid, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Notifications]
      summary: Get a channel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
    patch:
      tags: [Notifications]
      summary: Update a channel (blank secrets keep the stored value)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
    delete:
      tags: [Notifications]
      summary: Delete a channel
      responses:
        "204": { description: Deleted }
  /api/notifications/channels/{nid}/test:
    parameters:
      - { name: nid, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Notifications]
      summary: Send a test notification to a channel
      responses:
        "204": { description: Delivered }
        "502": { description: Delivery failed }
        "503": { description: Notifications are not enabled }

  /api/users:
    get:
      tags: [Users]
      summary: List users (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/User"
                    - type: object
                      properties:
                        servers:
                          type: integer
                          description: How many servers the account owns, which deleting it hands over
    post:
      tags: [Users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /api/users/{uid}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Users]
      summary: Update a user's role/quotas (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      tags: [Users]
      summary: Delete a user (admin)
      description: >
        Servers the account owns are reassigned to the admin performing the
        deletion, since a server cannot be left without an owner. That hands over
        console and file access, so an admin scoped to "users" alone gets 409
        when the target owns any server.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            The target owns servers and the caller does not hold the "servers"
            admin permission, or the target is the last admin.
  /api/users/{uid}/2fa/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [TwoFactor]
      summary: Reset a user's 2FA (admin; lost-device recovery)
      responses:
        "204": { description: 2FA reset }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users/{uid}/admin-role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [AdminRoles]
      summary: Assign or clear a user's scoped admin role (superadmin)
      description: >
        Grants the user a bundle of admin permissions via an AdminRole, or
        clears it with a null roleId. Superadmins already hold every permission,
        so assigning a role to one is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: integer, nullable: true }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Target is a superadmin }

  /api/admin-permissions:
    get:
      tags: [AdminRoles]
      summary: Catalog of admin permissions (superadmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    description: { type: string }

  /api/admin-roles:
    get:
      tags: [AdminRoles]
      summary: List admin roles (superadmin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminRole" }
    post:
      tags: [AdminRoles]
      summary: Create an admin role (superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRole" }
        "409": { description: Name already in use }

  /api/admin-roles/{rid}:
    parameters:
      - name: rid
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [AdminRoles]
      summary: Update an admin role (superadmin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRole" }
        "409": { description: Name already in use }
    delete:
      tags: [AdminRoles]
      summary: Delete an admin role (superadmin)
      responses:
        "204": { description: Deleted }
        "409": { description: Role is still assigned to users }

  /api/apikeys:
    get:
      tags: [APIKeys]
      summary: List your API keys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIKey" }
    post:
      tags: [APIKeys]
      summary: Create an API key (token shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/APIKey" }
                  token: { type: string, description: The plaintext bearer token (shown once) }
  /api/apikeys/{kid}:
    parameters:
      - { name: kid, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [APIKeys]
      summary: Revoke an API key
      responses:
        "204": { description: Revoked }

  /api/clusters/setup-manifest:
    get:
      tags: [Clusters]
      summary: What to run on a cluster before registering it (admin)
      description: >-
        A manifest creating a service account with only the access Quetzal
        needs, and a script that prints the kubeconfig to register. The script
        takes the cluster's address from the current kubectl context, and warns
        on stderr when that is a loopback address, which Quetzal cannot reach.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { type: string }
                  kubeconfigScript: { type: string }
                  namespace: { type: string }
                  serviceAccount: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/clusters:
    get:
      tags: [Clusters]
      summary: List clusters (non-admins get a reduced view)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cluster" }
    post:
      tags: [Clusters]
      summary: Register a cluster by kubeconfig (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kubeconfig]
              properties:
                name: { type: string }
                kubeconfig: { type: string, description: Stored encrypted at rest }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
  /api/clusters/{cid}:
    parameters:
      - { name: cid, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Clusters]
      summary: Update a cluster (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                kubeconfig: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
    delete:
      tags: [Clusters]
      summary: Remove a cluster (admin)
      responses:
        "204": { description: Removed }
        "409": { description: Cluster still holds servers or is the local cluster }
  /api/clusters/{cid}/test:
    parameters:
      - { name: cid, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Clusters]
      summary: Probe a cluster's connectivity (admin)
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
  /api/clusters/{cid}/nodes:
    parameters:
      - { name: cid, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Clusters]
      summary: List a cluster's nodes (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClusterNode" }

  /api/clusters/{cid}/storageclasses:
    parameters:
      - { name: cid, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Clusters]
      summary: List a cluster's storage classes (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StorageClassInfo" }

  /api/internal/wake:
    post:
      tags: [Internal]
      summary: Wake-on-connect callback (in-cluster activator)
      description: >
        HMAC-token authenticated; always returns 204 to avoid leaking server
        existence. Not for external callers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WakeRequest" }
      responses:
        "204": { description: Processed (or ignored) }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/internal/active:
    post:
      tags: [Internal]
      summary: Activity heartbeat callback (in-cluster proxy)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WakeRequest" }
      responses:
        "204": { description: Processed (or ignored) }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key created under Account → API keys.
    cookieAuth:
      type: apiKey
      in: cookie
      name: quetzal_session
      description: Session cookie set by POST /api/login (used by the web UI).
  parameters:
    ListBefore:
      name: before
      in: query
      required: false
      description: >
        Cursor for the log endpoints: return entries older than this id (pass the
        id of the oldest row already held). Omit for the newest page.
      schema: { type: integer }
    ServerId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Server ID
    UserId:
      name: uid
      in: path
      required: true
      schema: { type: integer }
      description: User ID
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    ImportIfExists:
      name: ifExists
      in: query
      required: false
      description: >-
        What to do when another template already has the imported one's slug:
        replace updates that template (bumping its version), copy adds this one
        beside it under the next free slug (paper-2, named "Paper (2)").
        Without it, such an import is refused with a 409. A server whose game
        is up keeps the version it started with until its pod is replaced: a
        stop, a restart, a change to its settings, a reinstall.
      schema: { type: string, enum: [replace, copy] }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ImportConflict:
      description: Another template already has this slug, and ifExists did not say what to do
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              existing:
                type: object
                properties:
                  slug: { type: string }
                  name: { type: string }
                  version: { type: integer }
                  servers: { type: integer, description: Servers created from that template }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        email:
          type: string
          format: email
          description: Optional, captured at first-run setup for password reset
        code:
          type: string
          description: TOTP or recovery code (second login step when 2FA is enabled)
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        isAdmin: { type: boolean, description: "Superadmin: holds every admin permission" }
        adminRoleId:
          type: integer
          nullable: true
          description: Scoped admin role granting a subset of admin permissions
        adminPerms:
          type: array
          items: { type: string }
          description: Resolved admin permissions (from isAdmin or the assigned role)
        maxServers: { type: integer, description: "Servers the account may own: -1 = unlimited, 0 = none. Admins are exempt." }
        maxMemoryMB: { type: integer, format: int64, description: "Total memory limit (MiB) of its servers: -1 = unlimited, 0 = none" }
        maxCpuMilli: { type: integer, format: int64, description: "Total CPU limit (millicores) of its servers: -1 = unlimited, 0 = none" }
        twoFactorEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminRole:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items:
            type: string
            enum: [servers, users, templates, clusters, database-hosts, notifications, settings, audit]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminRoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
    UserInput:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
        email: { type: string, format: email }
        isAdmin: { type: boolean }
        maxServers: { type: integer, description: "-1 = unlimited, 0 = none. A new account left without it may own no server." }
        maxMemoryMB: { type: integer, format: int64, description: "-1 = unlimited (a new account's default), 0 = none" }
        maxCpuMilli: { type: integer, format: int64, description: "-1 = unlimited (a new account's default), 0 = none" }
    Resources:
      type: object
      properties:
        memory: { type: string, example: "2Gi" }
        cpu: { type: string, example: "1" }
    Storage:
      type: object
      properties:
        type: { type: string, enum: [pvc], default: pvc }
        size: { type: string, example: "10Gi" }
        storageClass: { type: string, description: "empty = cluster default" }
        retainOnDelete: { type: boolean }
    Port:
      type: object
      description: >-
        A port on TCP and UDP is two entries, one per protocol. Each needs a
        name of its own, or none: unnamed, they are called p<port>-tcp and
        p<port>-udp (a port on one protocol only is p<port>).
      properties:
        name: { type: string }
        port: { type: integer }
        protocol: { type: string, enum: [TCP, UDP] }
        primary: { type: boolean }
        nodePort: { type: integer }
    Expose:
      type: object
      properties:
        type: { type: string, enum: [ClusterIP, NodePort, LoadBalancer] }
        annotations:
          type: object
          additionalProperties: { type: string }
        preserveClientIP: { type: boolean }
    Hibernation:
      type: object
      properties:
        enabled: { type: boolean }
        idleMinutes: { type: integer }
        wakeOnConnect: { type: boolean }
        proxy: { type: boolean }
    Status:
      type: object
      properties:
        phase:
          type: string
          enum: [Installing, Starting, Running, Stopping, Stopped, Crashed, Suspended, Hibernated, Error]
        endpoints:
          type: array
          items: { type: string }
        address: { type: string }
        message:
          type: string
          description: >-
            What the server is waiting on or why it failed, e.g. the done line
            a Starting server has not printed yet.
        crashCount: { type: integer }
        startedContainer:
          type: string
          description: >-
            The game container that printed one of its template's done lines.
            A ready container is reported Starting until it does, or until 30
            minutes have passed.
    Server:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        displayName: { type: string }
        namespace: { type: string }
        desiredState: { type: string, enum: [Running, Stopped, Suspended] }
        ownerId: { type: integer }
        image: { type: string }
        resources: { $ref: "#/components/schemas/Resources" }
        storage: { $ref: "#/components/schemas/Storage" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        expose: { $ref: "#/components/schemas/Expose" }
        hibernation: { $ref: "#/components/schemas/Hibernation" }
        hibernated: { type: boolean }
        sftp:
          type: object
          properties: { enabled: { type: boolean } }
        eulaAccepted: { type: boolean, description: "Minecraft EULA acceptance (templates with the \"eula\" egg feature)" }
        reaches:
          type: array
          items: { type: string }
          description: Slugs of the servers this one may reach inside the cluster
        clusterId: { type: integer }
        transfer:
          $ref: "#/components/schemas/TransferState"
        import:
          $ref: "#/components/schemas/ImportState"
        status: { $ref: "#/components/schemas/Status" }
    TransferState:
      type: object
      description: Present while a cross-cluster transfer is in progress
      properties:
        phase: { type: string, enum: [BackingUp, Restoring] }
        sourceCluster: { type: integer }
        targetCluster: { type: integer }
        prevState: { type: string, enum: [Running, Stopped, Suspended] }
        startedAt: { type: string, format: date-time }
        message: { type: string }
        cancelled:
          type: boolean
          description: A cancellation has been asked for; the controller is undoing the move.
    CreateServerRequest:
      type: object
      required: [name, template]
      properties:
        name: { type: string }
        template: { type: string, description: Template slug }
        image: { type: string, description: Image ref (defaults to the template's) }
        memory: { type: string }
        cpu: { type: string }
        storage: { $ref: "#/components/schemas/Storage" }
        env:
          type: object
          additionalProperties: { type: string }
        expose: { $ref: "#/components/schemas/Expose" }
        hibernation: { $ref: "#/components/schemas/Hibernation" }
        cluster: { type: string, description: Target cluster slug (empty = local) }
        start:
          type: boolean
          description: Start the server once created (with `pterodactyl`, once its data is in place)
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
          description: Overrides the template's ports (templates imported from eggs declare none)
        eulaAccepted: { type: boolean }
        pterodactyl:
          allOf: [{ $ref: "#/components/schemas/PterodactylSource" }]
          description: >-
            Import the data of a Pterodactyl server into the new one. The server
            is created stopped and a background job copies the data (see
            `import` on the server); it is then marked installed, so the
            template's install script does not run over the imported files.
    FileBulk:
      type: object
      required: [files]
      properties:
        root: { type: string, description: Directory holding the entries, relative to the data root }
        files:
          type: array
          maxItems: 1000
          items: { type: string, description: A plain entry name within root }
    PterodactylSource:
      type: object
      required: [url, apiKey]
      properties:
        url:
          type: string
          description: >-
            Address of the server's page on the panel
            (https://panel.example.com/server/1a2b3c4d), or the panel root with
            `identifier`.
        identifier: { type: string }
        apiKey:
          type: string
          format: password
          description: A client API key (ptlc_…) with access to the server. Used for the import only, never stored.
    ImportState:
      type: object
      description: The server's data import from Pterodactyl (absent if it was never imported)
      properties:
        phase: { type: string, enum: [Preparing, Downloading, Done, Failed] }
        source: { type: string, description: Panel host and server identifier }
        message: { type: string }
        bytes: { type: integer, description: Bytes copied so far }
        total: { type: integer, description: Archive size, when the panel announced it }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startAfter: { type: boolean }
    DatabaseHostInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { type: string, enum: [external, managed] }
        host: { type: string }
        port: { type: integer }
        connectHost: { type: string }
        connectPort: { type: integer }
        adminUser: { type: string }
        adminPassword: { type: string, format: password }
        maxDatabases: { type: integer, description: "0 = unlimited" }
        namespace: { type: string, description: managed only }
        image: { type: string, description: managed only }
        storageSize: { type: string, description: managed only }
    ServerDatabase:
      type: object
      properties:
        id: { type: integer }
        serverId: { type: integer }
        hostId: { type: integer }
        databaseName: { type: string }
        username: { type: string }
        password: { type: string, description: only present on create/get/rotate }
        remote: { type: string, description: MySQL allowed-from host (default %) }
        host: { type: string, description: address to connect to }
        port: { type: integer }
        hostName: { type: string }
        createdAt: { type: string, format: date-time }
    ServerStats:
      type: object
      properties:
        available: { type: boolean, description: "false when there is no usage to read; cpuMillicores and memoryBytes are then absent" }
        reason: { type: string, description: Why there is no usage to read (when available is false) }
        cpuMillicores: { type: integer }
        memoryBytes: { type: integer, format: int64 }
        cpuLimit: { type: string }
        memoryLimit: { type: string }
        rxBytes: { type: integer, format: int64, description: Cumulative received bytes (derive a rate from successive samples) }
        txBytes: { type: integer, format: int64, description: Cumulative transmitted bytes }
        diskTotalBytes: { type: integer, format: int64 }
        diskUsedBytes: { type: integer, format: int64 }
    TemplateVariable:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        envVariable: { type: string }
        type: { type: string }
        default: { type: string }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
        editable: { type: boolean }
        secret: { type: boolean }
    TemplateImage:
      type: object
      properties:
        displayName: { type: string }
        ref: { type: string }
        default: { type: boolean }
    Template:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/TemplateImage" }
        variables:
          type: array
          items: { $ref: "#/components/schemas/TemplateVariable" }
        wakeProtocol:
          type: string
          enum: [minecraft, any]
          description: >-
            How a sleeping server tells a player from a port scanner. With
            minecraft, only a Minecraft Java login on the game port wakes it
            and server-list pings are answered with the server shown asleep;
            with any, any connection wakes it. Unset picks minecraft for
            templates with the eula feature, any otherwise.
        done:
          type: array
          description: >-
            Console lines that mean the server has finished starting (egg
            config.startup.done). Each is text to find in an output line, or a
            regular expression when prefixed "regex:". Templates exported before
            this field carry a single line as doneRegex, which is still read.
          items: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        suggestedPorts:
          type: array
          description: >-
            Computed (not persisted) port suggestions inferred from the
            template's port-like variables, returned only when the template
            declares no ports. Each variable's port comes on TCP and on UDP, as
            Wings exposes an allocation; one is primary only when the template
            does not use its allocation (see allocatedPort). Used to pre-fill
            the create form's ports editor.
          items: { $ref: "#/components/schemas/Port" }
        allocatedPort:
          type: boolean
          description: >-
            Computed, and returned only when the template declares no ports:
            the egg hands the game its allocation (SERVER_PORT in its startup,
            server.build.default.port in its config files), so the game listens
            on the primary port its server is given, which no variable holds.
    ScheduleTask:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, stop, restart, command, backup] }
        payload: { type: string, description: "Console command (required for action=command)" }
        timeOffset:
          type: integer
          description: "Seconds to wait before this task (after the previous one). Max 86400."
        continueOnFailure:
          type: boolean
          description: "If true, a failure here doesn't abort the rest of the chain"
    Schedule:
      type: object
      properties:
        id: { type: integer }
        serverId: { type: integer }
        name: { type: string }
        cron: { type: string }
        timezone: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/ScheduleTask" }
        action:
          type: string
          enum: [start, stop, restart, command, backup]
          description: "Legacy mirror of the first task, for older clients"
        payload: { type: string, description: "Legacy mirror of the first task's payload" }
        enabled: { type: boolean }
        nextRun: { type: string, format: date-time }
        lastRun: { type: string, format: date-time }
        lastStatus: { type: string }
    ScheduleInput:
      type: object
      required: [name, cron, enabled]
      description: >
        Provide `tasks` (an ordered chain). For backward compatibility a single
        `action`/`payload` with no `tasks` is also accepted and normalized into a
        one-task chain.
      properties:
        name: { type: string }
        cron: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/ScheduleTask" }
        action: { type: string, enum: [start, stop, restart, command, backup] }
        payload: { type: string }
        enabled: { type: boolean }
        timezone:
          type: string
          description: >
            IANA zone the cron fields are read in, e.g. "Europe/Paris". Empty
            means the control plane's own zone, which in a container is UTC — so
            "0 4 * * *" would fire at 4am UTC rather than 4am where you are.
          example: Europe/Paris
    Backup:
      type: object
      properties:
        id: { type: integer }
        serverId: { type: integer }
        direction: { type: string, enum: [backup, restore] }
        phase:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Deleting]
          description: >-
            Deleting means the record is on its way out while its restic snapshot
            is being removed from the repository; it disappears once that
            succeeds, or returns to Succeeded carrying the reason it could not.
        sourceId: { type: integer }
        sizeBytes: { type: integer, format: int64 }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    BackupConfig:
      type: object
      properties:
        endpoint: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        region: { type: string }
        useSSL: { type: boolean }
        keepLast: { type: integer }
        runnerImage: { type: string }
        configured: { type: boolean }
        hasCredentials: { type: boolean }
        hasPassword: { type: boolean }
        editable: { type: boolean, description: The caller may change the target }

    BackupConfigInput:
      type: object
      properties:
        endpoint: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        region: { type: string }
        useSSL: { type: boolean }
        keepLast: { type: integer }
        runnerImage:
          type: string
          description: >-
            The restic image the backup jobs run, restic/restic:0.19.1 when
            empty. It must be restic 0.17 or later, which says when a
            repository does not exist yet (exit code 10).
        accessKey: { type: string }
        secretKey: { type: string }
        repoPassword: { type: string }
    Cluster:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        inCluster: { type: boolean }
        defaultStorageClass: { type: string, description: "empty = the cluster's own default storageClass" }
        endpointHost: { type: string, description: "DNS name or IP address published for this cluster's servers (400 otherwise); empty = the panel-wide setting" }
        reachable: { type: boolean }
        version: { type: string }
        nodeCount: { type: integer }
        lastCheckedAt: { type: string, format: date-time }
        statusMessage: { type: string }
    ClusterNode:
      type: object
      properties:
        name: { type: string }
        ready: { type: boolean }
        version: { type: string }
        os: { type: string }
        cpu: { type: string }
        memory: { type: string }
        internalIP: { type: string }
    StorageClassInfo:
      type: object
      properties:
        name: { type: string }
        provisioner: { type: string }
        isDefault: { type: boolean }
    ServerAccess:
      type: object
      properties:
        id: { type: integer }
        serverId: { type: integer }
        userId: { type: integer }
        username: { type: string }
        permissions:
          type: array
          items: { type: string }
    FileUpload:
      type: object
      description: A file being sent in pieces.
      properties:
        id: { type: string }
        serverId: { type: integer }
        path: { type: string }
        kind: { type: string, enum: [file, archive] }
        format: { type: string }
        size: { type: integer, format: int64 }
        received: { type: integer, format: int64, description: Bytes arrived so far; -1 when not looked up }
        chunkMax: { type: integer, description: The largest piece taken }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ServerInvite:
      type: object
      description: An open invitation. Its token is only in the mail.
      properties:
        id: { type: integer }
        serverId: { type: integer }
        email: { type: string }
        permissions: { type: array, items: { type: string } }
        invitedBy: { type: integer }
        invitedByName: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        userId: { type: integer }
        username: { type: string }
        serverId: { type: integer }
        serverName:
          type: string
          description: Slug of the server the action targeted, resolved at read time (global log only).
        action: { type: string }
        detail: { type: string }
    Event:
      type: object
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        type: { type: string }
        serverId: { type: integer }
        userId: { type: integer }
        username: { type: string }
        message: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
    NotificationChannel:
      type: object
      description: Secret config values are never returned, only whether they are set.
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        type: { type: string, enum: [discord, webhook, email] }
        enabled: { type: boolean }
        serverId: { type: integer, description: "0 = global catch-all" }
        events:
          type: array
          items: { type: string }
          description: Event-type allow-list (empty = all)
        config:
          type: object
          additionalProperties: { type: string }
          description: Non-secret settings
        secrets:
          type: object
          additionalProperties: { type: boolean }
          description: Which secret keys are configured
        failureStreak:
          type: integer
          description: >
            Events this channel has missed in a row since it last delivered one.
            A delivery is retried a few times (not after a refusal that will not
            change, such as a 404); one that still fails is not queued for later.
            A successful test delivery resets it.
        lastError:
          type: string
          description: Why the last missed delivery failed. Never contains the channel's URL.
        lastErrorAt: { type: string, format: date-time }
        lastDeliveryAt: { type: string, format: date-time }
    ChannelInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [discord, webhook, email] }
        enabled: { type: boolean }
        serverId: { type: integer }
        events:
          type: array
          items: { type: string }
          description: >-
            Event types to receive, from GET /api/notifications/event-types
            (another is refused); empty receives them all.
        config:
          type: object
          additionalProperties: { type: string }
          description: >
            Type-specific settings. discord: url. webhook: url, secret. A url
            is http:// or https://.
            email: host, port, username, password, from, to, tls; with no host,
            the channel sends through the panel's email settings (and its
            from, unless it sets one), which must then have a server.
            tls is "starttls" (the default, and required: a server that does
            not offer STARTTLS is refused), "tls" (implicit TLS, usually port
            465) or "none" (cleartext, only when asked for by name).
    SSHKey:
      type: object
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        userId: { type: integer }
        name: { type: string }
        publicKey: { type: string }
        fingerprint: { type: string }
    APIKey:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    WakeRequest:
      type: object
      required: [slug, token]
      properties:
        slug: { type: string }
        token: { type: string }
