name: Feature request
description: Something Quetzal should do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from the point of view of someone using the panel.
  - type: textarea
    id: elsewhere
    attributes:
      label: How other panels handle it
      description: If Pterodactyl, Pelican or another panel does this, how does it work there?
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
