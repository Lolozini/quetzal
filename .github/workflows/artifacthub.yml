name: Artifact Hub

# Publishes deploy/artifacthub-repo.yml next to the chart in GHCR, under the tag
# Artifact Hub reads ("artifacthub.io"). Chart releases push other tags, so this
# one stays; it only needs pushing again when the file changes.
on:
  push:
    branches: [main]
    paths:
      - deploy/artifacthub-repo.yml
      - .github/workflows/artifacthub.yml
  workflow_dispatch:

permissions: {}

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/charts/quetzal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.4
      - name: Push the repository metadata
        working-directory: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/quetzal:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
