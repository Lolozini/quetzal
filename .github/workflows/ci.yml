name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Go supports the two most recent majors; 1.23 stopped receiving security
  # fixes, which is how a pinned toolchain quietly becomes the vulnerability.
  GO_VERSION: "1.26"
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      # Nobody had ever run this, and it had thirteen reachable findings to
      # show for it -- ten of them in the SSH library the SFTP server is built
      # on. It fails the build on purpose: a new advisory in code this project
      # actually calls is exactly the thing worth interrupting a merge for, and
      # a report nobody is obliged to read is how the last ones accumulated.
      - name: govulncheck
        # Pinned, not @latest: govulncheck declares a minimum Go of its own, so
        # @latest would one day fail the build on a toolchain mismatch rather
        # than on a vulnerability -- an alarm that cries the wrong thing. Bump
        # it together with GO_VERSION.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # osv-scanner.toml ignores GO-2026-5932, an advisory on all of x/crypto
      # for its openpgp package. That holds only while nothing imports it.
      - name: x/crypto/openpgp stays out
        run: |
          if go list -deps ./... | grep -qx 'golang.org/x/crypto/openpgp.*'; then
            echo "golang.org/x/crypto/openpgp is imported: GO-2026-5932 applies now; see osv-scanner.toml" >&2
            exit 1
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint deploy/quetzal
      # The escape hatches an existing install needs: bring your own claim, your
      # own encryption key, your own environment. Rendering is not enough --
      # a typo'd `if` renders fine and quietly ignores the value -- so assert
      # what each one is supposed to change.
      - name: helm template (bring-your-own resources)
        run: |
          out="$(helm template quetzal deploy/quetzal \
            --set persistence.existingClaim=my-claim \
            --set secretKey.existingSecret=my-secret \
            --set secretKey.existingSecretKey=my-key \
            --set extraEnv[0].name=TZ --set extraEnv[0].value=Europe/Paris)"
          fail() { echo "chart ignored a value: $1"; exit 1; }
          echo "$out" | grep -q 'claimName: my-claim'      || fail existingClaim
          echo "$out" | grep -q 'name: "my-secret"'        || fail existingSecret
          echo "$out" | grep -q 'key: "my-key"'            || fail existingSecretKey
          ! echo "$out" | grep -q 'kind: PersistentVolumeClaim' || fail "claim created anyway"
          ! echo "$out" | grep -q 'quetzal-secretkey'            || fail "key generated anyway"
          # apiserver, controller and the migration step all need it.
          [ "$(echo "$out" | grep -c 'Europe/Paris')" = 3 ] || fail extraEnv
          # The apiserver allocates game ports and the controller the SFTP one,
          # from the same pool. Telling only one leaves the other on the
          # cluster's full range -- ports nobody opened on the firewall.
          ports="$(helm template quetzal deploy/quetzal \
            --set nodePort.min=30000 --set nodePort.max=30030 \
            | grep -c 'QUETZAL_NODEPORT_MIN' || true)"
          [ "$ports" = 3 ] || fail "nodePort pool reached $ports of 3 containers"
          # Log retention has to reach the apiserver, which is what prunes.
          echo "$out" | grep -q 'QUETZAL_EVENT_RETENTION_DAYS' || fail retention
          # More than one replica is safe on Postgres and destroys a SQLite
          # database. The chart must refuse the second case rather than let it be
          # discovered in production.
          ! helm template quetzal deploy/quetzal --set replicaCount=2 >/dev/null 2>&1             || fail "replicaCount=2 accepted on sqlite"
          ! helm template quetzal deploy/quetzal --set replicaCount=2 --set db.driver=postgres >/dev/null 2>&1             || fail "replicaCount=2 accepted with a ReadWriteOnce claim"
          ha="$(helm template quetzal deploy/quetzal --set replicaCount=2             --set db.driver=postgres --set persistence.enabled=false)"
          echo "$ha" | grep -q 'replicas: 2'      || fail "replicaCount ignored"
          echo "$ha" | grep -q 'type: RollingUpdate' || fail "two replicas still roll with Recreate"
          # Metrics must stay off the port the Ingress publishes at "/" prefix.
          # They were served next to the panel, which made the server count --
          # and a full table scan per scrape -- readable by anyone with the URL.
          echo "$out" | grep -q 'QUETZAL_METRICS_ADDR' || fail "apiserver metrics port not set"
          svc="$(helm template quetzal deploy/quetzal --show-only templates/service.yaml)"
          ! echo "$svc" | grep -q '9091' || fail "the Service publishes the metrics port"
          ! echo "$svc" | grep -q 'metrics' || fail "the Service publishes the metrics port"
          # What Kubernetes accepts but mishandles: a port name shared by two
          # containers in the pod (a probe selecting it resolves to the first
          # one), and a namespaced object with no namespace of its own (kubectl
          # puts it in its context's default). hack/check-chart.py says why for
          # each; it lives there because inline Python cannot be indented inside
          # a YAML block scalar without breaking one or the other.
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          helm template quetzal deploy/quetzal --namespace quetzal | python3 hack/check-chart.py || fail "the rendered chart has problems (see above)"
          echo "ok"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: unit tests
        run: go test -race ./...
      - name: build
        run: go build ./...
      # Where uint is 32 bits, an id parsed as 64 and converted does not fail --
      # it becomes a different id, and the handler acts on the wrong row. That
      # cannot happen on this runner, so the guard against it cannot be checked
      # here either. Build and run the id parsing where it can.
      - name: 32-bit build and id parsing
        # Every login in these tests hashes with argon2id, 64 MiB a time. A
        # 32-bit process has 4 GiB of address space, and the default GC pacing
        # once let the heap reach it ("out of memory" mid-suite, gone on a
        # rerun). The limit makes the GC hand those blocks back well before.
        env:
          GOMEMLIMIT: 1GiB
        run: |
          GOARCH=386 go build ./...
          GOARCH=386 go test ./internal/api/

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Build the Quetzal image so the config.files render path (which copies the
      # renderer out of this image) is exercised end-to-end.
      - name: Build image
        run: docker build -t quetzal:e2e .
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: quetzal-e2e
          # A supported Kubernetes, not a pin that aged out. 1.31 is long past
          # end of life, and an older apiserver also knows fewer things to object
          # to: the duplicate-port-name warning below does not exist before 1.33.
          node_image: kindest/node:v1.35.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # Rendering the chart and grepping it proves it says what was meant. Only
      # the apiserver can say whether Kubernetes accepts it, and some of what it
      # objects to it reports as a warning and lets through: two containers in
      # the pod declaring the same port name went to production that way, and
      # pointed the controller's liveness probe at the apiserver. A plain
      # dry-run prints that warning and exits 0; --warnings-as-errors is what
      # makes it fail the build. Nothing is created (server-side dry-run), in a
      # namespace no test uses.
      - name: Chart is accepted by the apiserver
        run: |
          set -euo pipefail
          ns=quetzal-chart-dryrun
          kubectl create namespace "$ns"
          for args in "" \
              "--set ingress.enabled=true --set ingress.host=panel.example.test" \
              "--set replicaCount=2 --set db.driver=postgres --set persistence.enabled=false"; do
            echo "== helm template $args"
            # shellcheck disable=SC2086 # $args is a list of flags on purpose
            helm template quetzal deploy/quetzal --namespace "$ns" $args \
              | kubectl --warnings-as-errors apply --dry-run=server -n "$ns" -f -
          done
          kubectl delete namespace "$ns" --wait=false
      - name: Load image into kind
        run: kind load docker-image quetzal:e2e --name quetzal-e2e
      # The backup test brings up an S3 server (VersityGW, since MinIO stopped
      # publishing images) and runs restic in-cluster. Left to
      # itself the kind node pulls both while the test is already waiting on a
      # readiness deadline, so anything wrong with a pull surfaces as "minio not
      # ready" and looks like a failure of whatever is in the changeset. Pulling
      # here makes a bad image a step failure that says so -- which is how the
      # MinIO move off Docker Hub was identified rather than guessed at.
      - name: Preload the fixture images into kind
        run: |
          set -eux
          for img in versity/versitygw:v1.8.0 restic/restic:0.17.3; do
            docker pull "$img"
            kind load docker-image "$img" --name quetzal-e2e
          done
      - name: e2e tests (kind)
        # kind-action points the default kubeconfig at the cluster.
        env:
          QUETZAL_E2E_IMAGE: quetzal:e2e
        run: go test -tags e2e -v -timeout 20m ./test/e2e/...

  # Publish the rolling image for the default branch. Tagged releases (v*) are
  # built with stamped version metadata by the separate release workflow.
  image:
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # sign the image keylessly (cosign)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signed like the releases (see release.yml), so `latest` verifies too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
