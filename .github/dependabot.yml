# Weekly dependency updates, minor and patch bumps grouped per ecosystem so they
# arrive as one pull request each. Security fixes come as soon as an advisory
# is published, outside this schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
      # Major versions (React, Vite, TypeScript) together, to be migrated as one.
      web-major:
        update-types: [major]
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  # Actions are pinned to a commit; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's latest major is often not an LTS; move between LTS lines by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
